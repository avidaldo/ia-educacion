# Verifies the site (tests, content checks, build) on every push and pull request, and publishes it to
# GitHub Pages from master. Pages must be set to deploy from GitHub Actions:
#   gh api -X PUT repos/avidaldo/ia-educacion/pages -f build_type=workflow
# The last Docusaurus build stays in the gh-pages branch as a fallback. To serve it again:
#   gh api -X PUT repos/avidaldo/ia-educacion/pages -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'
name: Site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push cancels the checks of a pull request, but never a deployment halfway through.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # provenance diffs read old blobs from history
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest -q
      - name: Content checks (errors fail, warnings are reported)
        run: uv run engine/check.py
      - name: Build
        run: uv run engine/build.py
      - name: Accessibility audit (axe-core, both languages and themes)
        run: |
          uv run engine/shoot.py --audit --theme both --lang es
          uv run engine/shoot.py --audit --theme both --lang gl
      - if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: engine/_build
          retention-days: 14
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: engine/_build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
