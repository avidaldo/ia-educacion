# New engine (content/ + engine/). Until the switch it only verifies and uploads the built site as a
# downloadable artifact; Docusaurus keeps deploying from master through deploy.yml.
# At the switch: add master to the push branches and the deploy job below (upload-pages-artifact +
# deploy-pages), and set Pages to deploy from GitHub Actions.
name: Site

on:
  push:
    branches: [rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # provenance diffs read old blobs from history
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Unit tests
        run: uv run pytest -q
      - name: Content checks (errors fail, warnings are reported)
        run: uv run engine/check.py
      - name: Build
        run: uv run engine/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: engine/_build
          retention-days: 14
