  - id: fundamentos
    modules:
      - intro-ia
      - chatbots
      - prompts: [ejemplos, avanzado]
  - id: herramientas
    modules:
      - skills
      - notebooks
      - bots-educativos
      - navegadores-agenticos
  - id: aplicaciones
    modules:
      - tests-moodle
      - webs-educativas: [presentaciones]
      - vibe-coding
      - n8n
  - id: marco
    modules:
      - etica-legal: [normativa, anexo-formacion-xunta]
  - id: recursos
    modules:
      - recursos
advanced: [n8n]
